      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          var bg = isDark ? '#0A0A0C' : '#FAFAFA';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          document.documentElement.style.backgroundColor = bg;
          var oldMetas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < oldMetas.length; i++) {
            oldMetas[i].parentNode.removeChild(oldMetas[i]);
          }
          var meta = document.createElement('meta');
          meta.setAttribute('name', 'theme-color');
          meta.setAttribute('content', bg);
          meta.setAttribute('id', 'lekhix-theme-color');
          document.head.appendChild(meta);
        } catch (e) {}
      })();
    </script>
